[project]
name = "preppulse-ai"
version = "1.0.0"
description = "PrepPulse AI: AI Resume Analyzer & Voice/Text Mock Interview Prep Coach"
authors = [{ name = "Jagan T. Jiju", email = "jagantj28@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
